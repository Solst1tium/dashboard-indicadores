<div class="charts-grid">
    <div class="panel">
        <h3>Ventas mensuales del año 2026</h3>
        <p-chart type="line" [data]="lineData" [options]="lineOptions" height="280px" />
    </div>
    <div class="panel">
        <h3>Indicadores por categoría</h3>
        <p-chart type="doughnut" [data]="doughnutData" [options]="doughnutOptions" height="280px" />
    </div>
</div>
